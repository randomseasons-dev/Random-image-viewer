[package]
name = "picture-viewer"
version = "1.3.0"
description = "Picture Viewer"
authors = ["Dong Nguyen"]
edition = "2021"

[lib]
name = "picture_viewer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp", "ico", "tiff", "tga", "pnm", "dds", "hdr", "qoi", "exr", "ff"] }
imagesize = "0.13"
percent-encoding = "2"
dirs = "6"
tauri-plugin-single-instance = "2"

[target."cfg(windows)".dependencies]
clipboard-win = "5"
windows-sys = { version = "0.61", features = ["Win32_UI_Shell", "Win32_Foundation"] }

[profile.release]
opt-level = 3
lto = "thin"
